<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Randomizeee</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1 id="logo">Randomizeee</h1>
      <p id="tagline">nothing here is decided by you</p>
    </header>

    <main>
      <div id="output-wrapper">
        <div id="output-box">
          <span id="output-label">your string</span>
          <p id="output-string">???</p>
        </div>
      </div>

      <div id="meta-info">
        <span class="meta-chip" id="meta-length">length: —</span>
        <span class="meta-chip" id="meta-case">case: —</span>
        <span class="meta-chip" id="meta-charset">charset: —</span>
        <span class="meta-chip" id="meta-font">font: —</span>
      </div>

      <button id="generate-btn">generate</button>

      <div id="copy-toast">copied!</div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
